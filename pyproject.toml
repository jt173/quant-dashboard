[project]
name = "quant-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "cvxpy>=1.7.5",
    "fastapi>=0.128.8",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.2.13",
    "pydantic-settings>=2.11.0",
    "scipy>=1.13.1",
    "sqlalchemy>=2.0.55",
    "uvicorn[standard]>=0.39.0",
    "yfinance>=1.2.0",
]

[project.scripts]
quant-dashboard = "quant_dashboard:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.141.1",
    "mypy>=1.19.1",
    "pandas-stubs>=2.2.2.240807",
    "pre-commit>=4.3.0",
    "pyportfolioopt>=1.6.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=quant_dashboard --cov-report=term-missing"

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cvxpy", "cvxpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypfopt", "pypfopt.*"]
ignore_missing_imports = true
