repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1   # run `pre-commit autoupdate` to bump this
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false